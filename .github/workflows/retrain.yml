name: Weekly Retrain

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install pandas scikit-learn joblib

      - run: python artifacts/train_model.py

      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          mv model.pkl road_encoder.pkl city_encoder.pkl artifacts/
          git add artifacts/model.pkl artifacts/road_encoder.pkl artifacts/city_encoder.pkl
          git commit -m "Auto-retrain: $(date +'%Y-%m-%d')" || echo "No changes to commit"
          git push
